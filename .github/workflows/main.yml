name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Expo tools
        run: npx expo install @expo/cli

      - name: Build Android
        run: npx expo export --platform android

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: episodevault-android
          path: dist
